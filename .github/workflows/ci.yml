name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.x"

      - name: Validate repository governance
        run: python scripts/check_governance.py

      # APPLICATION_VALIDATION_COMMAND: NOT_CONFIGURED
      # Before executable application code is merged, replace this comment block with a step that
      # executes the FULL APPLICATION VALIDATION command declared in docs/DEVELOPMENT_WORKFLOW.md.
      # check_governance.py deliberately fails when src/ contains application files while this
      # placeholder or the validation-contract placeholder remains.

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      # The action uses the event's commit range; full history scans remain separate operations.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Scan changed commits for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
